# LLM Configuration for DSPy
# Teacher models: Used during optimization (strong, expensive)
# Student models: Used in production (cheaper, faster)

teacher:
  provider: "openai"
  model: "gpt-5o"  # Next-gen model for optimization
  temperature: 0.0
  max_tokens: 2000

student:
  provider: "openai"
  model: "gpt-5o-mini"  # Cost-effective for production
  temperature: 0.0
  max_tokens: 1500

# Alternative configurations
gpt5o_teacher:
  provider: "openai"
  model: "gpt-5o-2025-01-20"  # Latest GPT-5o
  temperature: 0.0
  max_tokens: 2000

anthropic_teacher:
  provider: "anthropic"
  model: "claude-sonnet-4.5"
  temperature: 0.0
  max_tokens: 2000

local_student:
  provider: "ollama"
  model: "llama3:8b"
  temperature: 0.0
  max_tokens: 1500

# Evaluator model (LLM-as-Judge)
evaluator:
  provider: "openai"
  model: "gpt-5o"  # Best for evaluation quality
  temperature: 0.3
  max_tokens: 1000
